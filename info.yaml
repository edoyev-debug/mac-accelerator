project:
  title:        "MAC Accelerator"
  author:       "EDO.Y"
  discord:      ""
  description:  "RISC-V-style multiply-accumulate ISA extension accelerator. Fuses multiply and accumulate into a single hardware instruction (MAC.ACC), removing the hazard-detection stall between MUL and ADD."
  language:     "Verilog"
  clock_hz:     50000000
  tiles:        "1x1"

  top_module:  "tt_um_mac_accelerator"

  source_files:
    - "tt_um_mac_accelerator.v"

pinout:
  ui[0]: "operand data bus bit 0 (operand A or B, one byte at a time)"
  ui[1]: "operand data bus bit 1"
  ui[2]: "operand data bus bit 2"
  ui[3]: "operand data bus bit 3"
  ui[4]: "operand data bus bit 4"
  ui[5]: "operand data bus bit 5"
  ui[6]: "operand data bus bit 6"
  ui[7]: "operand data bus bit 7"

  uo[0]: "low byte of a read, else busy flag"
  uo[1]: "low byte of a read (bit 1)"
  uo[2]: "low byte of a read (bit 2)"
  uo[3]: "low byte of a read (bit 3)"
  uo[4]: "low byte of a read (bit 4)"
  uo[5]: "low byte of a read (bit 5)"
  uo[6]: "low byte of a read (bit 6)"
  uo[7]: "low byte of a read (bit 7)"

  uio[0]: "valid strobe"
  uio[1]: "op select bit 0"
  uio[2]: "op select bit 1"
  uio[3]: "unused"
  uio[4]: "unused"
  uio[5]: "unused"
  uio[6]: "unused"
  uio[7]: "unused"

yaml_version: 6